name: Amazon filter tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly full run. Cron is in UTC: 21:00 UTC = 02:30 IST. GITHUB_EVENT_NAME=schedule
  # makes utils/RunConfig.ts run every filter option and every product.
  schedule:
    - cron: '0 21 * * *'
  # Manual run from the Actions tab; tick the box to get the same full coverage as the nightly run.
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run all filter options and products (same as the nightly run)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    # The nightly full run is slow (slowMo + one tab per product), so allow plenty of time.
    timeout-minutes: 240
    env:
      IS_CRON: ${{ inputs.full_run == true && 'true' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
